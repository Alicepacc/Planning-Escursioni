<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f4efe5" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#151a17" media="(prefers-color-scheme: dark)" />
		<script>
			// tema scelto nel profilo (chiaro/scuro), applicato prima del disegno per non lampeggiare
			try {
				var tema = localStorage.getItem('cordata.tema');
				if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema;
			} catch (e) {}
		</script>
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
