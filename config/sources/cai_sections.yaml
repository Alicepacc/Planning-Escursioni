# Sezioni CAI da cui scoprire le attività (SPEC §7.1). Verificato il 13/11/2026 con
# `python -m cordata_ingest.probes cai_sections`. Nessun dato personale in questo file.
#
# `pilot: true` = sezioni scelte dall'utente per il pilota della Fase 2: Bolzano, Appiano e
# Vipiteno (16/11/2026, prima risposta), Bressanone e sezioni SAT (checkpoint della Fase 1).
#
# site_type:
#   wordpress_cai  – sottosito di organizzazione.cai.it (WordPress multisite, REST attiva)
#   wordpress      – sito proprio WordPress con REST attiva
#   sito_proprio   – CMS diverso: serve un adapter dedicato
#   da_verificare  – sito ufficiale non individuato con certezza
#
# Per i siti WordPress l'elenco dei PDF è:
#   {base_url}/wp-json/wp/v2/media?mime_type=application/pdf&per_page=100&page=N[&after=ISO8601]
# con paginazione negli header X-WP-Total / X-WP-TotalPages.
sections:
